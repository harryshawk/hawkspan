name: HawkSpan release gate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python3 -m pip install --disable-pip-version-check numpy safetensors
      - name: Run complete release gate
        run: scripts/check-release.sh

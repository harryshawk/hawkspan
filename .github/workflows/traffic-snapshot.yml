name: Traffic snapshot

on:
  schedule:
    - cron: "17 08 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hawkspan-traffic-snapshot
  cancel-in-progress: false

jobs:
  capture:
    name: Preserve aggregate GitHub traffic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Capture aggregate traffic
        shell: bash
        run: |
          set -euo pipefail
          snapshot_date=$(date -u +%F)
          snapshot_dir="$RUNNER_TEMP/snapshot"
          mkdir -p "$snapshot_dir"
          gh api "repos/$GH_REPO/traffic/views" > "$snapshot_dir/views.json"
          gh api "repos/$GH_REPO/traffic/clones" > "$snapshot_dir/clones.json"
          gh api "repos/$GH_REPO/traffic/popular/referrers" > "$snapshot_dir/referrers.json"
          gh api "repos/$GH_REPO/traffic/popular/paths" > "$snapshot_dir/paths.json"
          printf '{"schema_version":1,"repository":"%s","captured_at":"%s"}\n' \
            "$GH_REPO" "$(date -u +%FT%TZ)" > "$snapshot_dir/metadata.json"
          printf '%s\n' "$snapshot_date" > "$RUNNER_TEMP/snapshot-date"
      - name: Commit snapshot to isolated history branch
        shell: bash
        run: |
          set -euo pipefail
          snapshot_date=$(cat "$RUNNER_TEMP/snapshot-date")
          git fetch origin traffic-history:refs/remotes/origin/traffic-history || true
          if git show-ref --verify --quiet refs/remotes/origin/traffic-history; then
            git switch --create traffic-history --track origin/traffic-history
          else
            git switch --orphan traffic-history
            git rm -rf .
          fi
          mkdir -p "snapshots/$snapshot_date"
          cp "$RUNNER_TEMP/snapshot/"*.json "snapshots/$snapshot_date/"
          git add snapshots
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "HawkSpan Metrics"
          git config user.email "metrics@hawkspan.invalid"
          git commit -m "Capture aggregate traffic for $snapshot_date"
          git push origin HEAD:traffic-history

name: Installation problem
description: Report trouble installing, configuring, upgrading, or removing HawkSpan.
title: "[Installation]: "
labels:
  - installation
body:
  - type: markdown
    attributes:
      value: |
        Do not include usernames, hostnames, IP addresses, SSH material, personal paths, or the contents of private configuration files.
  - type: input
    id: release
    attributes:
      label: HawkSpan release
      placeholder: v0.1.0 or tree-sha256:...
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Installation stage
      options:
        - Prerequisite check
        - Initial configuration
        - SSH or route validation
        - Foreground validation
        - Background service installation
        - Upgrade or rollback
        - Uninstallation
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Provide macOS version, Mac architecture, Node.js version, and installation method.
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What you attempted
      description: Describe the documented step and sanitized command used.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Sanitized result
      description: Include the exact error after removing private values.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I ran scripts/check-release.sh before installation.
          required: true
        - label: I removed credentials and machine-specific values from this report.
          required: true


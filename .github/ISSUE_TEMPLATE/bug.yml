name: Bug report
description: Report reproducible HawkSpan behavior that appears incorrect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove usernames, hostnames, addresses, keys, tokens, personal paths, message contents, and workload data before submitting.
  - type: input
    id: release
    attributes:
      label: HawkSpan release
      description: Provide the tag, commit, or release_id from release/release-manifest.json.
      placeholder: v0.1.0 or tree-sha256:...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Provide macOS version, Mac architecture, and Node.js version.
      placeholder: macOS 15.x, Apple silicon, Node.js 22.x
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Installation or upgrade
        - Connection or routing
        - Messages or acknowledgements
        - Jobs or wakeups
        - Artifact transfer
        - Local HTML control
        - Application plugin
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Give the smallest repeatable sequence using sanitized values.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include relevant errors or status output after removing private values.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I removed credentials, private network details, personal paths, message contents, and workload data.
          required: true
        - label: I searched existing issues for the same problem.
          required: true

